name: GTA 6 Clipper & YouTube Publisher

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow requests curl-cffi

      - name: Restore OAuth Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$CLIENT_SECRETS" ]; then
            echo "$CLIENT_SECRETS" > client_secrets.json
          fi
          if [ -n "$YOUTUBE_TOKEN" ]; then
            echo "$YOUTUBE_TOKEN" > youtube_token.json
          fi

      - name: Run GTA 6 Autonomous Clipper
        run: |
          python auto_pipeline.py --oneshot
