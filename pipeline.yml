name: GTA 6 Clipper & YouTube Publisher

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow requests curl-cffi

      - name: Restore Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$CLIENT_SECRETS" ]; then
            echo "$CLIENT_SECRETS" > client_secrets.json
            echo "[+] client_secrets.json restored"
          else
            echo "[!] Note: CLIENT_SECRETS_JSON secret is optional if already authenticated"
          fi
          if [ -n "$YOUTUBE_TOKEN" ]; then
            echo "$YOUTUBE_TOKEN" > youtube_token.json
            echo "[+] youtube_token.json restored"
          else
            echo "[!] Note: YOUTUBE_TOKEN_JSON secret not set yet; workflow will store generated Shorts in GitHub Artifacts"
          fi

      - name: Run Autonomous Clipper
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python auto_pipeline.py --oneshot

      - name: Upload Generated Shorts to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-shorts
          path: automated_clips/
          if-no-files-found: ignore
